<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzeriStep</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --bg:#bdd7e5; --surface:#d7e9f2; --surface-2:#c4dce8;
    --ink:#132c42; --muted:#456579; --faint:#5f8095;
    --line:#9ebfd1; --line-soft:#b4d0dd;
    --primary:#176b91; --primary-deep:#0d4c6a; --accent:#e11d48;
    --ru:#e11d48; --ru-bg:#fdeaef; --en:#0f9b8e; --en-bg:#e5f6f3;
    --good:#16a34a; --good-bg:#e7f7ec; --bad:#dc2626; --bad-bg:#fdecec;
    --gold:#d97706; --gold-bg:#fdf2e0;
    --shadow:0 1px 2px rgba(11,55,80,.08), 0 8px 24px rgba(11,55,80,.16);
    --shadow-lg:0 12px 40px rgba(11,55,80,.24);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%; overflow:hidden; scroll-behavior:smooth;scroll-padding-top:150px}
  body{
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    line-height:1.55; -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  ::selection{background:var(--primary);color:#fff}

  .panel{max-width:1180px; margin:0 auto; padding:72px 20px 40px}

  /* ============================================================
     TRAINER
     ============================================================ */
  .known-wrap{position:fixed; top:18px; left:max(18px,calc((100vw - 1180px)/2 + 20px)); right:150px; z-index:80; margin:0}
  .known-line{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; margin-bottom:4px}
  .known-n{font-size:1.9rem; font-weight:800; color:var(--primary-deep); font-variant-numeric:tabular-nums; line-height:1}
  .known-lbl{font-size:.95rem; font-weight:700; color:var(--muted)}
  .known-bar{height:7px; border-radius:6px; background:var(--surface-2); overflow:hidden}
  .known-bar i{display:block; height:100%; width:0; border-radius:6px; background:var(--primary); transition:width .35s}

  .trainer-controls{display:flex; gap:7px; flex-wrap:wrap; align-items:center; justify-content:center; margin-bottom:8px}
  .dir-toggle{
    display:inline-flex; align-items:center; background:var(--surface); border:1.5px solid var(--line);
    border-radius:8px; padding:2px; gap:1px; cursor:pointer; user-select:none;
  }
  .lane-select-wrap{
    display:inline-flex; align-items:center; background:var(--surface); border:1.5px solid var(--line);
    border-radius:8px; padding:2px 5px 2px 7px; cursor:pointer; user-select:none;
  }
  .lane-select{
    min-width:104px; border:0; outline:0; background:transparent; color:var(--muted);
    font-family:inherit; font-size:.75rem; font-weight:700; padding:4px 3px; cursor:pointer;
  }
  .lane-select:focus-visible{outline:2px solid var(--primary); outline-offset:1px; border-radius:5px}
  .lane-select option{background:var(--surface); color:var(--ink)}
  .dir-opt{padding:4px 8px; border-radius:7px; font-size:.75rem; font-weight:700; color:var(--muted); transition:.15s; white-space:nowrap}
  .dir-opt.on{background:var(--accent); color:#fff}
  #fmt-toggle .dir-opt.on{background:var(--primary)}
  .scope-lbl{font-size:.74rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin-right:2px}
  .lvl-wrap{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-bottom:8px}
  .lvl-wrap input[type=range]{flex:1 1 180px; min-width:150px; max-width:260px; height:24px; padding:0 8px; border:1px solid rgba(35,127,170,.28); border-radius:999px; background:linear-gradient(to right,var(--primary) 0 var(--level-fill,100%),rgba(31,41,55,.78) var(--level-fill,100%) 100%); box-shadow:inset 0 1px 2px rgba(0,0,0,.18),0 3px 8px rgba(35,127,170,.16); appearance:none; -webkit-appearance:none; cursor:pointer}
  .lvl-wrap input[type=range]::-webkit-slider-runnable-track{height:10px; border-radius:999px; background:transparent}
  .lvl-wrap input[type=range]::-webkit-slider-thumb{width:22px; height:22px; margin-top:-6px; border:3px solid var(--primary); border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(35,127,170,.30); appearance:none; -webkit-appearance:none}
  .lvl-wrap input[type=range]::-moz-range-track{height:10px; border:0; border-radius:999px; background:transparent}
  .lvl-wrap input[type=range]::-moz-range-progress{height:10px; border-radius:999px; background:var(--primary)}
  .lvl-wrap input[type=range]::-moz-range-thumb{width:22px; height:22px; border:3px solid var(--primary); border-radius:999px; background:#fff; box-shadow:0 2px 6px rgba(35,127,170,.30)}
  .lvl-badge{font-size:.78rem; font-weight:800; color:var(--primary-deep); font-variant-numeric:tabular-nums; white-space:nowrap}
  .lvl-count{font-size:.66rem; font-weight:700; color:var(--faint)}

  .music-dock{position:fixed; right:18px; top:18px; z-index:80; display:flex; flex-direction:column; align-items:flex-end; gap:8px}
  .music-toggle{
    border:1px solid rgba(255,255,255,.58); background:var(--primary); color:#fff; cursor:pointer;
    font-family:inherit; font-size:.72rem; font-weight:800; padding:5px 8px; border-radius:999px;
    box-shadow:0 5px 14px rgba(35,127,170,.28); transition:.16s;
  }
  .music-toggle:hover{background:var(--primary-deep); transform:translateY(-1px)}
  .lvl-tag{display:inline-block; font-size:.58rem; font-weight:900; letter-spacing:.05em; padding:1px 5px;
           border-radius:5px; background:var(--surface-2); color:var(--faint); margin-left:6px; vertical-align:middle}
  /* quiz card */
  #quiz{min-height:340px}
  .qcard{
    background:linear-gradient(135deg,#d8eaf3 0%,#b6d3e1 100%); border:1px solid #8fb7ca; border-radius:20px;
    box-shadow:var(--shadow-lg); padding:26px 28px 24px; position:relative; overflow:hidden;
    animation:pop .28s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .qactions{position:absolute; top:18px; right:20px; z-index:2; display:flex; align-items:center}
  .qnext-btn{border:none; background:var(--good); color:#fff; cursor:pointer; font-family:inherit;
             font-size:1rem; font-weight:800; padding:8px 13px; border-radius:11px; transition:.15s}
  .qnext-btn:hover{background:#15803d}
  .qhead{margin-bottom:20px}
  .qcard.has-next .qword{white-space:nowrap; overflow:hidden}
  .qword{font-size:clamp(2.5rem,6.75vw,3.75rem); font-weight:800; letter-spacing:-.02em; line-height:1.1; color:var(--ink)}
  .qsplit{display:flex; gap:22px; align-items:stretch}
  .qsplit .opts{flex:1; min-width:0}
  .opts{display:grid; gap:10px; align-content:start}
  .qillus{
    flex:none; width:min(40%,400px); align-self:stretch; border-radius:25px;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(150px,20vw,256px); line-height:1; overflow:hidden;
    background:#bcd8e5; border:1px solid #9ebfd1;
  }
  .qillus.qillus-swatch{border:none; box-shadow:0 8px 22px color-mix(in srgb, var(--sw) 45%, transparent), inset 0 0 0 1px rgba(255,255,255,.25)}
  .opt{
    display:flex; align-items:center; gap:17px; text-align:left; width:100%;
    background:#c7dfe9; border:1.5px solid #9fbfd1; border-radius:18px;
    padding:19px 23px; cursor:pointer; font-family:inherit; font-size:1.35rem; font-weight:600; color:var(--ink);
    transition:.14s;
  }
  .opt:hover:not(.locked){border-color:var(--primary); transform:translateX(3px)}
  .opt .num{
    flex:none; width:35px; height:35px; border-radius:10px; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:1.06rem; font-weight:800; color:var(--muted);
  }
  .opt.locked{cursor:default}
  .opt.correct{background:var(--good-bg); border-color:var(--good); color:var(--good)}
  .opt.correct .num{background:var(--good); color:#fff; border-color:var(--good)}
  .opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad)}
  .opt.wrong .num{background:var(--bad); color:#fff; border-color:var(--bad)}
  .opt.dim{opacity:.5}
  .qfoot{display:flex; align-items:center; gap:12px; margin-top:18px; min-height:30px}
  .qfoot:empty{display:none}
  .verdict{font-weight:800; font-size:1rem}
  .verdict.ok{color:var(--good)}
  .verdict.no{color:var(--bad)}
  .verdict .sol{color:var(--muted); font-weight:600; margin-left:8px}
  .next-btn{
    margin-left:auto; border:none; background:var(--primary); color:#fff; cursor:pointer;
    font-family:inherit; font-size:.95rem; font-weight:700; padding:11px 22px; border-radius:12px; transition:.15s;
  }
  .next-btn:hover{background:var(--primary-deep)}
  .typebox{flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; align-content:start}
  .typebox input{
    width:100%; min-width:0; font-family:inherit; font-size:1.5rem; font-weight:700;
    padding:16px 18px; border-radius:14px; border:2px solid var(--line);
    background:var(--surface); color:var(--ink); transition:.15s;
  }
  .typebox input:focus{outline:none; border-color:var(--primary)}
  .typebox input.ok{border-color:#16a34a; background:rgba(22,163,74,.07)}
  .typebox input.no{border-color:#dc2626; background:rgba(220,38,38,.06)}
  .type-go{
    align-self:flex-start; font-family:inherit; font-size:.95rem; font-weight:800; cursor:pointer;
    padding:11px 22px; border-radius:11px; border:none; background:var(--primary); color:#fff;
  }
  .type-go:hover{filter:brightness(1.06)}
  .type-near{font-size:.9rem; font-weight:700; color:#b45309}
  .type-also{font-size:.85rem; color:var(--faint); line-height:1.5}

  /* result / empty cards */
  .result{
    background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow-lg);
    padding:34px 30px; text-align:center; animation:pop .3s ease;
  }
  .result .big{font-size:3rem; margin-bottom:8px}
  .result h3{font-size:1.5rem; font-weight:800; margin-bottom:6px}
  .result .score{font-size:2.6rem; font-weight:800; letter-spacing:-.02em; color:var(--primary); margin:10px 0}
  .result .rmeta{color:var(--muted); font-size:.95rem}
  .result .missed{
    text-align:left; max-width:460px; margin:20px auto 0; background:var(--surface-2);
    border:1px solid var(--line); border-radius:14px; padding:14px 18px;
  }
  .result .missed h4{font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--bad); margin-bottom:8px}
  .result .missed .mrow{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-top:1px solid var(--line-soft); font-size:.95rem}
  .result .missed .mrow:first-of-type{border-top:none}
  .result .missed .mrow b{color:var(--ink)}
  .result .missed .mrow span{color:var(--muted)}
  .result-btns{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap}
  .result-btns button{
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;
    font-family:inherit; font-size:.95rem; font-weight:700; padding:12px 22px; border-radius:12px; transition:.15s;
  }
  .result-btns button.primary{background:var(--primary); color:#fff; border-color:var(--primary)}
  .result-btns button:hover{border-color:var(--primary)}
  .result-btns button.primary:hover{background:var(--primary-deep)}

  /* Library layout removed; the page now contains only the trainer. */

  @media (max-width:620px){
    .panel{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding:52px 8px 8px}
    .known-wrap{top:14px; left:8px; right:128px}
    .known-line{margin-bottom:3px}
    .known-n{font-size:1.35rem}
    .known-lbl{font-size:.76rem}
    .known-bar{height:6px}
    .trainer-controls{gap:3px; flex-wrap:wrap; row-gap:3px; margin-bottom:3px}
    .dir-toggle{padding:2px; gap:1px}
    .lane-select-wrap{padding:2px 3px 2px 5px}
    .lane-select{min-width:91px; font-size:.66rem; padding:3px 2px}
    .dir-opt{padding:3px 5px; font-size:.66rem; border-radius:6px}
    .lvl-wrap{gap:3px; flex-wrap:wrap; margin-bottom:4px}
    .scope-lbl{font-size:.58rem; margin-right:0}
    .lvl-wrap input[type=range]{flex:1 1 0; min-width:0; height:20px; padding:0 5px}
    .lvl-wrap input[type=range]::-webkit-slider-runnable-track{height:8px}
    .lvl-wrap input[type=range]::-webkit-slider-thumb{width:18px; height:18px; margin-top:-5px; border-width:2px}
    .lvl-wrap input[type=range]::-moz-range-track{height:8px}
    .lvl-wrap input[type=range]::-moz-range-progress{height:8px}
    .lvl-wrap input[type=range]::-moz-range-thumb{width:18px; height:18px; border-width:2px}
    .lvl-badge{font-size:.64rem}
    .lvl-count{flex-basis:100%; text-align:center; font-size:.54rem; line-height:1}
    #quiz{min-height:0}
    .qcard{padding:10px 12px 10px; border-radius:16px}
    .qactions{top:10px; right:12px}
    .qnext-btn{font-size:.85rem; padding:6px 10px; border-radius:10px}
    .qhead{margin-bottom:8px}
    .qword{font-size:clamp(1.98rem,9.6vw,2.46rem); line-height:1.08}
    .qsplit{flex-direction:column-reverse; gap:10px}
    .qillus{width:100%; align-self:auto; height:130px; font-size:84px; border-radius:17px}
    .opts{gap:5px}
    .opt{padding:8px 11px; font-size:1.13rem; border-radius:13px; gap:11px}
    .opt .num{width:29px; height:29px; border-radius:8px; font-size:.9rem}
    .qfoot{margin-top:4px; min-height:0}
    .typebox{gap:6px}
    .typebox input{font-size:1.1rem; padding:9px 10px; border-radius:10px}
    .type-go{font-size:.82rem; padding:7px 14px; border-radius:9px}
    .music-dock{right:14px; top:14px}
    .music-toggle{font-size:.68rem; padding:4px 7px}
  }
</style>
<style id="bgfx-css">
/* ==== bgfx: living animated background ================================ */
/* A registered @property + transition on --c1..--ac looks like the elegant way
   to crossfade a tab change. It is a TRAP: the transitions are created,
   report playState "running", and their currentTime never leaves 0 - which
   PINS the property at the outgoing value forever. Every structural check
   still passes (the scene attribute flips, the motif rect swaps, the particle
   count changes, getAnimations() climbs) while all 43 scenes silently wear
   scene one's colours. The dissolve is done in JS on plain opacity instead. */
html{transition:background-color .5s ease}
#bgfx{position:fixed;inset:0;z-index:-9;pointer-events:none;overflow:hidden;
  --c1:#203040;--c2:#26405c;--c3:#101820;--ac:#8fd0ff;--tint:.55;--pw:1;--px:0;--py:0;--scr:0;
  transition:opacity .42s ease}
#bgfx *{position:absolute;pointer-events:none}
#bgfx svg *{position:static}

/* 1 - the wash: three radial gradients in the scene's own three colours */
#bgfx .wash{inset:-14%;background:
  radial-gradient(58% 46% at 74% -6%, var(--c2) 0%, transparent 62%),
  radial-gradient(52% 44% at 6% 104%, var(--c1) 0%, transparent 60%),
  radial-gradient(44% 40% at 46% 48%, var(--c3) 0%, transparent 72%);
  opacity:var(--tint);will-change:transform;
  transform:translate3d(calc(var(--px)*-10px),calc(var(--scr)*-5vh + var(--py)*-8px),0)}

/* 2 - five drifting blobs on deliberately mismatched periods (41/57/47/69/83s)
   so the layer never realigns inside a session */
#bgfx .blob{border-radius:50%;filter:blur(78px);will-change:transform}
#bgfx[data-mode="dark"] .blob{mix-blend-mode:screen}
#bgfx[data-mode="light"] .blob{mix-blend-mode:multiply;filter:blur(96px)}
#bgfx .b1{width:78vmax;height:78vmax;left:-30vmax;top:-28vmax;opacity:calc(.34*var(--pw));
  background:radial-gradient(circle,var(--c2) 0%,transparent 66%);animation:bxd1 41s ease-in-out infinite}
#bgfx .b2{width:66vmax;height:66vmax;right:-26vmax;top:6vh;opacity:calc(.30*var(--pw));
  background:radial-gradient(circle,var(--ac) 0%,transparent 68%);animation:bxd2 57s ease-in-out infinite}
#bgfx .b3{width:60vmax;height:60vmax;left:-12vmax;bottom:-28vmax;opacity:calc(.26*var(--pw));
  background:radial-gradient(circle,var(--c1) 0%,transparent 68%);animation:bxd3 47s ease-in-out infinite}
#bgfx .b4{width:48vmax;height:48vmax;right:-14vmax;bottom:-20vmax;opacity:calc(.22*var(--pw));
  background:radial-gradient(circle,var(--c2) 0%,transparent 70%);animation:bxd4 69s ease-in-out infinite}
#bgfx .b5{width:40vmax;height:40vmax;left:32vw;top:26vh;opacity:calc(.18*var(--pw));
  background:radial-gradient(circle,var(--ac) 0%,transparent 72%);animation:bxd5 83s ease-in-out infinite}
@keyframes bxd1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,8vh) scale(1.16)}}
@keyframes bxd2{0%,100%{transform:translate(0,0) scale(1.06)}50%{transform:translate(-11vw,12vh) scale(.92)}}
@keyframes bxd3{0%,100%{transform:translate(0,0) scale(.94)}50%{transform:translate(10vw,-10vh) scale(1.12)}}
@keyframes bxd4{0%,100%{transform:translate(0,0) scale(1.02)}50%{transform:translate(-8vw,-13vh) scale(.87)}}
@keyframes bxd5{0%,100%{transform:translate(0,0) scale(.9)}50%{transform:translate(-14vw,9vh) scale(1.25)}}

/* 3 - aurora: two wide skewed sheets that slide across each other */
#bgfx .aur{inset:-40% -30%;filter:blur(46px);will-change:transform,opacity;--az:1}
#bgfx[data-mode="dark"] .aur{mix-blend-mode:screen}
#bgfx[data-mode="light"] .aur{mix-blend-mode:multiply;--az:.5}
#bgfx .a1{opacity:calc(.22*var(--pw)*var(--az));animation:bxa1 96s ease-in-out infinite;
  background:linear-gradient(72deg,transparent 20%,var(--ac) 42%,transparent 52%,var(--c2) 68%,transparent 82%)}
#bgfx .a2{opacity:calc(.15*var(--pw)*var(--az));animation:bxa2 131s ease-in-out infinite;
  background:linear-gradient(-58deg,transparent 24%,var(--c1) 46%,transparent 60%,var(--ac) 74%,transparent 88%)}
@keyframes bxa1{0%,100%{transform:translate3d(-8%,4%,0) skewY(-6deg) scaleY(1)}
  50%{transform:translate3d(9%,-6%,0) skewY(7deg) scaleY(1.3)}}
@keyframes bxa2{0%,100%{transform:translate3d(7%,-5%,0) skewY(5deg) scaleY(1.15)}
  50%{transform:translate3d(-10%,7%,0) skewY(-8deg) scaleY(.85)}}

/* 4 - the canvas: the per-scene system (stars, orbits, steam, tide, ...) */
#bgfx .cnv{inset:0;width:100%;height:100%;display:block}
#bgfx .cnv{opacity:var(--pw)}
#bgfx[data-mode="light"] .cnv{opacity:calc(.95*var(--pw))}

/* 5 - three sheets of drifting light, 44 / 63 / 87 s. The mismatch is the
   point: equal periods make the layer visibly loop */
#bgfx .dap{inset:-25%;will-change:transform;background-repeat:no-repeat;--dz:1}
#bgfx[data-mode="dark"] .dap{mix-blend-mode:soft-light;--dz:.62}
#bgfx[data-mode="light"] .dap{mix-blend-mode:overlay;--dz:1.5}
#bgfx .p1{opacity:calc(.30*var(--dz));animation:bxp1 44s ease-in-out infinite;
  background-image:radial-gradient(closest-side,rgba(255,255,255,.95),transparent 72%),
   radial-gradient(closest-side,rgba(255,255,255,.8),transparent 70%),
   radial-gradient(closest-side,rgba(255,255,255,.7),transparent 72%);
  background-position:18% 26%,63% 14%,84% 62%;background-size:44% 38%,32% 28%,38% 34%}
#bgfx .p2{opacity:calc(.20*var(--dz));animation:bxp2 63s ease-in-out infinite;
  background-image:radial-gradient(closest-side,rgba(255,255,255,.9),transparent 72%),
   radial-gradient(closest-side,rgba(255,255,255,.75),transparent 70%);
  background-position:72% 34%,26% 62%;background-size:36% 30%,42% 36%}
#bgfx .p3{opacity:calc(.14*var(--dz));animation:bxp3 87s ease-in-out infinite;
  background-image:radial-gradient(closest-side,rgba(255,255,255,.85),transparent 74%),
   radial-gradient(closest-side,rgba(255,255,255,.7),transparent 70%);
  background-position:44% 16%,8% 76%;background-size:28% 24%,34% 28%}
@keyframes bxp1{0%,100%{transform:translate3d(0,0,0) scale(1) rotate(0)}33%{transform:translate3d(3.2vw,-2.4vh,0) scale(1.13) rotate(4deg)}66%{transform:translate3d(-2.4vw,2.8vh,0) scale(.93) rotate(-3deg)}}
@keyframes bxp2{0%,100%{transform:translate3d(0,0,0) scale(1.05) rotate(0)}40%{transform:translate3d(-3.6vw,1.8vh,0) scale(.9) rotate(-5deg)}75%{transform:translate3d(2.8vw,-3.2vh,0) scale(1.17) rotate(3deg)}}
@keyframes bxp3{0%,100%{transform:translate3d(0,0,0) scale(.95) rotate(0)}50%{transform:translate3d(2.2vw,3.2vh,0) scale(1.19) rotate(6deg)}}

/* 6 - the per-scene motif sheet: one tiled SVG pattern that carries its OWN
   animation, so a whole viewport of living texture costs one element. The
   parallax wrapper exists because .motif already owns its transform. */
#bgfx .par{display:none;inset:0;will-change:transform;
  transform:translate3d(calc(var(--px)*20px),calc(var(--py)*15px),0);transition:transform .5s ease-out}
/* `currentColor` inside a <pattern> resolves against the PATTERN's own
   inherited colour, not against the rect that references it - so colouring
   .mr leaves every motif drawn in whatever text colour the host page happens
   to set, which on a parchment report is brown. The colour has to land on the
   <svg> that owns the <defs>. */
#bgfx .motif{inset:-70px;width:calc(100% + 140px);height:calc(100% + 140px);
  color:var(--ac);opacity:calc(.5*var(--pw));animation:bxsway 74s ease-in-out infinite;will-change:transform}
#bgfx[data-mode="light"] .motif{opacity:calc(.46*var(--pw))}
@keyframes bxsway{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(-24px,15px) rotate(.24deg)}66%{transform:translate(17px,-11px) rotate(-.19deg)}}
#bgfx .motif .mv{animation:bxflow 11s linear infinite}
#bgfx .motif .mv2{animation-duration:15s;animation-delay:-5s}
@keyframes bxflow{to{stroke-dashoffset:-340}}
#bgfx .motif .mn{animation:bxbreathe 7s ease-in-out infinite}
#bgfx .motif .mn2{animation-duration:9.5s;animation-delay:-3s}
@keyframes bxbreathe{0%,100%{opacity:.3}50%{opacity:.75}}
#bgfx .motif .mspin{animation:bxspin 120s linear infinite;transform-origin:120px 120px}
@keyframes bxspin{to{transform:rotate(360deg)}}

/* 7 - a wide diagonal band crossing the page. Without a blend mode this is a
   plain white veil at up to 46% - which is what turned every dark scene into
   grey fog. It has to LIFT what it crosses, not paint over it. */
#bgfx .sheen{inset:-30vh -60vw;will-change:transform;animation:bxsweep var(--sheen,24s) linear infinite;
  background:linear-gradient(104deg,transparent 36%,rgba(255,255,255,.30) 46%,
   rgba(255,255,255,.46) 50%,rgba(255,255,255,.30) 54%,transparent 64%)}
#bgfx[data-mode="dark"] .sheen{mix-blend-mode:overlay;opacity:.5}
#bgfx[data-mode="light"] .sheen{mix-blend-mode:soft-light;opacity:.8}
@keyframes bxsweep{0%{transform:translateX(-34%)}100%{transform:translateX(34%)}}

/* 8 - the glyph field: DOM particles, randomised per element */
#bgfx .field{inset:0;overflow:hidden;opacity:var(--pw)}
#bgfx .pt{bottom:-40px;color:var(--ac);
  font:400 16px/1 "Segoe UI Symbol","Segoe UI Historic",system-ui,sans-serif;
  will-change:transform,opacity;animation:bxrise linear infinite}
#bgfx[data-mode="dark"] .pt{text-shadow:0 0 12px currentColor}
@keyframes bxrise{
  0%{transform:translate3d(0,0,0) rotate(0) scale(.7);opacity:0}
  12%{opacity:.75}
  50%{transform:translate3d(calc(var(--sx,40px)*.5),-52vh,0) rotate(calc(var(--sp,180deg)*.5)) scale(1.08)}
  88%{opacity:.4}
  100%{transform:translate3d(var(--sx,40px),-112vh,0) rotate(var(--sp,180deg)) scale(.8);opacity:0}}
#bgfx .dn{top:-40px;bottom:auto;animation-name:bxfall}
@keyframes bxfall{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
  10%{opacity:.7}
  50%{transform:translate3d(calc(var(--sx,40px)*.6),52vh,0) rotate(calc(var(--sp,180deg)*.5))}
  90%{opacity:.45}
  100%{transform:translate3d(var(--sx,40px),112vh,0) rotate(var(--sp,180deg));opacity:0}}

/* 9 - grain: a fine texture that keeps a huge flat gradient from banding */
#bgfx .grain{inset:-2px;opacity:.10;will-change:transform;animation:bxgrain .9s steps(4) infinite;
  background-image:repeating-conic-gradient(rgba(255,255,255,.09) 0% 25%,transparent 0% 50%);
  background-size:3px 3px}
#bgfx[data-mode="light"] .grain{opacity:.1;
  background-image:repeating-conic-gradient(rgba(90,60,20,.10) 0% 25%,transparent 0% 50%)}
@keyframes bxgrain{0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}
  50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}100%{transform:translate(0,0)}}

/* 10 - vignette: pulls the eye back to the middle of a very wide page */
#bgfx .vig{inset:0}
#bgfx[data-mode="dark"] .vig{background:radial-gradient(112% 84% at 50% 40%,transparent 32%,rgba(0,0,0,.32) 70%,rgba(0,0,0,.66) 100%)}
#bgfx[data-mode="light"] .vig{mix-blend-mode:multiply;
  background:radial-gradient(120% 90% at 50% 38%,transparent 46%,rgba(96,72,36,.16) 100%)}

/* 11 - the phone diet ---------------------------------------------------
   Every layer above carries will-change or an infinite transform animation, so
   each one is a permanently resident GPU texture. On a 393x852 phone the full
   set is roughly 38 MB of continuously animated texture, four of them
   blend-mode layers that force a per-frame readback - more tile memory than the
   phone has to spare, so it evicts the tiles holding the page's TEXT and
   re-rasters them. The symptom is the page's own text blanking for about a
   tenth of a second during a scroll, never the background looking wrong, which
   is why it reads as a content bug and gets hunted in the wrong place.
   Four layers come off every phone unconditionally, chosen as the faintest
   member of each family plus the one that is sub-pixel at a handset's device
   ratio; scene_css() drops two more per scene wherever the scene's own --pw
   puts them under 7% effective opacity. Desktop always keeps all ten.
   A viewport-width branch is responsive design, NOT the banned
   adapt-to-an-accessibility-setting branch - nothing here reads an OS toggle. */
@media (max-width:900px){
  #bgfx .grain,          /* .10, a 3px texture: sub-pixel at 2.6-3x */
  #bgfx .b5,             /* smallest blob, inside the field of four larger ones */
  #bgfx .p3,             /* third of three light sheets; 44/63s still mismatch */
  #bgfx .a2{             /* fainter of the two aurora sheets */
    display:none}
}

#bgfx .mr{display:none;color:var(--ac)}
#bgfx[data-scene="train"] .mr-target{display:none}
#bgfx[data-scene="lib"] .mr-pages{display:block}

html{background:#b5d2e1}
body{background-color:transparent !important}
.panel,#panel-train,#panel-lib,main{background-color:transparent !important}
</style></head>

    {lvl:'C2', az:'sosial təminat', ru:'социальное обеспечение', en:'social security; welfare', emoji:'🛡️'},
    {lvl:'C2', az:'məcburi köçkün', ru:'вынужденный переселенец', en:'internally displaced person', emoji:'⛺'},
    {lvl:'C2', az:'demoqrafiya', ru:'демография', en:'demography', emoji:'📊'},
    {lvl:'C2', az:'ehtiram', ru:'почтение', en:'respect; reverence', emoji:'🙏'},
    {lvl:'C2', az:'mərhum', ru:'покойный', en:'deceased; late', emoji:'🪦'},
    {lvl:'C2', az:'vətən', ru:'родина', en:'homeland; motherland', emoji:'🇦🇿'},
    {lvl:'C2', az:'el', ru:'народ / община', en:'people; community', emoji:'👥'},
    {lvl:'C2', az:'soydaş', ru:'сородич, человек того же народа', en:'compatriot; fellow countryman', emoji:'👥'},
    {lvl:'C2', az:'didərgin', ru:'изгнанник', en:'exile; displaced person', emoji:'🧳'},
    {lvl:'C2', az:'dahi', ru:'гений', en:'genius', emoji:'💡'},
    {lvl:'C2', az:'nadan', ru:'невежда', en:'ignorant person; ignoramus', emoji:'🙈'},
  ]},
];

/* ---- give every word an illustration; abstract words get a fitting picture ---- */
const EXTRA_EMOJI = {
  'Təəccüblənmək':'😲',
  'Nə':'❓','Niyə':'🤔','Necə':'⚙️','Hansı':'👉','Neçə':'🔢','Nə qədər':'📊','Və ya':'🔀','Məsələn':'💡','Əsasən':'🎯',
  'Otaq':'🚪','Balkon':'🏙️','Xalça':'🧶','Pərdə':'🎭','Stol · masa':'🍽️','Soyuducu':'🧊','Soba':'🔥','Qaz pilitəsi':'🍳',
  'Əlüzyuyan':'🚰','Dəsmal':'🧺','Şkaf':'🗄️','Oturma otağı':'📺',
  'Satıcı':'🏪','Müştəri':'🛒','Təzədir':'🥬','Ucuz':'🪙','Bəs 10 manat endirim mümkündür?':'🏷️','Mümkündür':'👍','Son qiymət nədir?':'🧾',
  'Hissə':'🧩','Böyük':'🐘','Balaca':'🐜','Qısa':'✂️','Uzun':'🦒','Bol':'🌊','Biraz':'🤏',
  'Adətən':'🔁','Bəzən':'🌦️','Nadirən':'💎','Xüsusilə':'⭐',
  'Bazar ertəsi':'1️⃣','Çərşənbə axşamı':'2️⃣','Çərşənbə':'3️⃣','Cümə axşamı':'4️⃣','Cümə':'5️⃣','Şənbə':'6️⃣','Bazar':'7️⃣',
  'Kəmər':'🥋','Uzunqol köynək':'👚',
};
CATS.forEach(cat=>{
  if(cat.type==='poem' || cat.type==='colors') return;
  const fill = arr => arr.forEach(w=>{ if(!w.emoji && EXTRA_EMOJI[w.az]) w.emoji = EXTRA_EMOJI[w.az]; });
  if(cat.groups) cat.groups.forEach(g=>fill(g.words)); else fill(cat.words);
});

/* ============ BUILD POOL ============ */
const POOL = [];
CATS.forEach(cat=>{
  if(cat.type==='poem') return;
  const meta = {catId:cat.id, catAz:cat.az, catRu:cat.ru, catIcon:cat.icon, ac:cat.ac};
  if(cat.type==='colors'){
    cat.colors.forEach(c=> POOL.push({az:c.az, ru:c.ru, en:c.en, hex:c.hex, lvl:c.lvl||'A1', ...meta}));
    return;
  }
  const add = arr => arr.forEach(w=> POOL.push({az:w.az, ru:w.ru, en:w.en, emoji:w.emoji, lvl:w.lvl||'A1', ...meta}));
  if(cat.groups) cat.groups.forEach(g=> add(g.words));
  else add(cat.words);
});

/* ============================================================
   TRAINER LOGIC
   ============================================================ */
const LSKEY='azeri-trainer-v1';
let prog = loadProg();
function loadProg(){
  try{ const p=JSON.parse(localStorage.getItem(LSKEY)); if(p&&p.stats) return p; }catch(e){}
  return {stats:{}, best:0, life:{seen:0,correct:0}, bestSprint:0};
}
function saveProg(){ try{ localStorage.setItem(LSKEY, JSON.stringify(prog)); }catch(e){} }
function st(az){ return prog.stats[az] || (prog.stats[az]={seen:0,correct:0}); }

const LANES={
  ru2az:{prompt:'ru',answer:'az',placeholder:'Write in Azerbaijani…'},
  az2ru:{prompt:'az',answer:'ru',placeholder:'Write in Russian…'},
  en2az:{prompt:'en',answer:'az',placeholder:'Write in Azerbaijani…'},
  az2en:{prompt:'az',answer:'en',placeholder:'Write in English…'}
};
const LANE_KEYS=Object.keys(LANES);
let dir='az2en';
const FMTKEY='azeri-fmt';
let fmt=(function(){ try{ const v=localStorage.getItem(FMTKEY); return v==='type'?'type':'choice'; }catch(e){ return 'choice'; } })();

/* ----- difficulty: the slider means "this level AND everything below it" ----- */
const LVLS=['A1','A2','B1','B2','C1','C2'];
const LVLKEY='azeri-maxlvl';
let maxLvl=(function(){ try{ const v=localStorage.getItem(LVLKEY); return LVLS.indexOf(v)>=0?v:'C1'; }catch(e){ return 'C1'; } })();
function lvlOk(w){ return LVLS.indexOf(w.lvl||'A1') <= LVLS.indexOf(maxLvl); }
let cur=null, curOpts=[], answered=false, streak=0, lastAz=null;
/* ----- helpers ----- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lane(){ return LANES[dir]||LANES.ru2az; }
function hasLaneText(w){ const l=lane(); return Boolean(w[l.prompt]&&w[l.answer]); }
function activePool(){ return POOL.filter(w=>lvlOk(w)&&hasLaneText(w)); }
function field(){ return lane().answer; }
function promptField(){ return lane().prompt; }

function weightedPick(pool){
  let total=0; const list=pool.map(w=>{
    const s=st(w.az); let wt=1;
    if(s.seen===0) wt+=2;
    if(w.az===lastAz) wt=0.02;
    total+=wt; return {w,wt};
  });
  let r=Math.random()*total;
  for(const it of list){ r-=it.wt; if(r<=0) return it.w; }
  return list[list.length-1].w;
}

/* ----- synonym handling -----
   39 Russian glosses are shared by two Azerbaijani words (adam/İnsan = человек,
   çarpayı/Yataq = кровать). Both words are real and worth knowing, so the deck keeps them -
   but a distractor that shares the PROMPT is also a correct answer, and marking it wrong
   teaches the learner that a right word is wrong. Two rules follow: never offer such a word
   as a distractor, and in typing mode accept any of them. */
function nkey(t){
  t=(t||'').trim().replace(/İ/g,'i');
  return t.toLowerCase().replace(/̇/g,'').replace(/[?!.,·]/g,'').replace(/\s+/g,' ').trim();
}
function bareLatin(t){
  return nkey(t).replace(/ə/g,'e').replace(/ı/g,'i').replace(/ğ/g,'g')
                .replace(/ş/g,'s').replace(/ç/g,'c').replace(/ö/g,'o').replace(/ü/g,'u');
}
/* every answer that is legitimately correct for this prompt, this direction */
function acceptedFor(item){
  const p=promptField(), f=field(), out=[];
  POOL.filter(hasLaneText).forEach(w=>{ if(nkey(w[p])===nkey(item[p])) out.push(w[f]); });
  if(!out.length) out.push(item[f]);
  return [...new Set(out)];
}

function buildOptions(item){
  const pool=activePool();
  const f=field(), correct=item[f];
  const p=promptField();
  const clash=w=>nkey(w[p])===nkey(item[p]);           // shares the prompt -> also correct
  let same=pool.filter(w=>w.catId===item.catId && w.az!==item.az && !clash(w));
  let src = same.length>=3 ? same : pool.filter(w=>w.az!==item.az && !clash(w));
  shuffle(src);
  const picked=[]; const used=new Set([correct]);
  for(const w of src){ if(picked.length>=3) break; if(!used.has(w[f])){ used.add(w[f]); picked.push(w); } }
  const opts=[item,...picked]; shuffle(opts); return opts;
}

/* ----- stats ----- */
/* ----- "words you know" -----
   Deliberately counted over the WHOLE deck, not the current slider/category selection: a
   progress number that jumps when you move a filter stops being a progress number.
   Known = answered correctly at least once. */
function knownCounts(){
  let known=0, learning=0;
  POOL.forEach(w=>{
    const s=prog.stats[w.az];
    if(!s || !s.seen) return;
    if(s.correct>=1) known++; else learning++;
  });
  return {known:known, learning:learning, total:POOL.length};
}
function paintKnown(){
  const k=knownCounts();
  const n=document.getElementById('known-n'); if(!n) return;
  n.textContent=k.known;
  document.getElementById('known-tot').textContent=k.total;
  document.getElementById('known-fill').style.width=(k.total? (k.known/k.total*100):0).toFixed(2)+'%';
}

function updateStats(){
  paintKnown();
}

/* ----- render ----- */
const quiz=document.getElementById('quiz');
function illusHTML(item){
  if(item.hex) return `<div class="qillus qillus-swatch" style="--sw:${item.hex};background:${item.hex}"></div>`;
  if(item.emoji) return `<div class="qillus">${item.emoji}</div>`;
  return '';
}
function renderCard(item){
  cur=item; answered=false; curOpts=buildOptions(item);
  const promptWord = item[promptField()];
  const typing = fmt==='type';
  const optsHTML = typing
    ? `<div class="typebox">
         <input id="type-in" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
                spellcheck="false" placeholder="${lane().placeholder}">
         <button class="type-go" id="type-go">Check</button>
       </div>`
    : `<div class="opts">${curOpts.map((o,i)=>`
        <button class="opt" data-i="${i}"><span class="num">${i+1}</span><span>${o[field()]}</span></button>`).join('')}</div>`;
  quiz.innerHTML = `
    <div class="qcard" style="--ac:${item.ac}">
      <div class="qhead">
        <div class="qword">${promptWord}</div>
      </div>
      <div class="qsplit">
        ${optsHTML}
        ${illusHTML(item)}
      </div>
      <div class="qfoot"></div>
    </div>`;
  if(typing){
    const inp=quiz.querySelector('#type-in');
    quiz.querySelector('#type-go').addEventListener('click', checkTyped);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); checkTyped(); }});
    inp.focus();
  }else{
    quiz.querySelectorAll('.opt').forEach(b=> b.addEventListener('click', ()=> choose(+b.dataset.i)));
  }
}

function showCardNext(){
  const card=quiz.querySelector('.qcard');
  if(!card) return;
  card.classList.add('has-next');
  const slot=document.createElement('div');
  slot.className='qactions';
  card.appendChild(slot);
  slot.innerHTML='<button class="qnext-btn" id="card-next-btn" type="button">Next ▶</button>';
  slot.querySelector('#card-next-btn').addEventListener('click', next);
}

/* ----- typed answers ----- */
function checkTyped(){
  if(answered) return;
  const inp=quiz.querySelector('#type-in');
  const raw=(inp&&inp.value||'').trim();
  if(!raw) return;
  answered=true;

  const accepted=acceptedFor(cur);
  // a gloss like "картина / фотография" means either half is a correct answer
  const parts=[];
  accepted.forEach(a=> String(a).split(/[\/·;]/).forEach(x=>{ if(x.trim()) parts.push(x.trim()); }));
  const exact = parts.some(p=>nkey(p)===nkey(raw));
  const near  = !exact && parts.some(p=>bareLatin(p)===bareLatin(raw));   // right word, missing ə/ğ/ş…
  const ok = exact||near;
  score(ok);

  inp.classList.add(ok?'ok':'no');
  inp.disabled=true;
  // compare loosely too, or a diacritic-free answer lists its own word as "also correct"
  const others=accepted.filter(a=>nkey(a)!==nkey(raw) && bareLatin(a)!==bareLatin(raw));
  const alsoHTML = others.length ? `<div class="type-also">Also correct: ${others.join(', ')}</div>` : '';
  const f=quiz.querySelector('.qfoot');

  if(ok && !near && !others.length){
    clearTimeout(window._adv); window._adv=setTimeout(()=>{ if(answered) next(); }, 300);
    return;
  }
  clearTimeout(window._adv);
  const right = accepted.join(' · ');
  f.innerHTML = ok
    ? `<span class="verdict ok">✓ Correct</span>
       ${near?`<span class="type-near">Correct spelling: ${cur[field()]}</span>`:''}
       ${alsoHTML}`
    : `<span class="verdict no">✕ Wrong<span class="sol">${cur[promptField()]} → ${right}</span></span>`;
  showCardNext();
}

/* one scoring path for both answer formats */
function score(ok){
  const s=st(cur.az); s.seen++; prog.life.seen++;
  if(ok){
    s.correct++; prog.life.correct++; streak++;
    if(streak>prog.best) prog.best=streak;
  }else{
    streak=0;
  }
  lastAz=cur.az;
  saveProg(); updateStats();
}

function choose(i){
  if(answered) return; answered=true;
  const chosen=curOpts[i], ok = chosen.az===cur.az;
  score(ok);

  // visuals
  const btns=quiz.querySelectorAll('.opt');
  btns.forEach((b,bi)=>{
    b.classList.add('locked');
    if(curOpts[bi].az===cur.az) b.classList.add('correct');
    else if(bi===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if(ok){
    // right answer → jump to the next card instantly (brief green flash only)
    clearTimeout(window._adv); window._adv=setTimeout(()=>{ if(answered) next(); }, 120);
  }else{
    // wrong answer → keep the highlights visible until the user advances
    clearTimeout(window._adv);
    showCardNext();
  }
}

function next(){
  clearTimeout(window._adv);
  if(activePool().length<2){ msgCard('🗂️','Not enough words','Raise the difficulty level to continue.'); return; }
  const item=weightedPick(activePool());
  renderCard(item); updateStats();
}

function msgCard(icon,title,text,btnLabel,btnFn){
  const btn = btnLabel ? `<div class="result-btns"><button class="primary" id="msg-btn">${btnLabel}</button></div>`:'';
  quiz.innerHTML=`<div class="result"><div class="big">${icon}</div><h3>${title}</h3><div class="rmeta">${text}</div>${btn}</div>`;
  if(btnLabel){ quiz.querySelector('#msg-btn').addEventListener('click', btnFn); }
}

/* ----- direction toggle ----- */
const dirSelect=document.getElementById('dir-select');
function setDir(d){
  dir=LANES[d]?d:'az2en';
  dirSelect.value=dir;
  paintLvl();
  const l=lane();
  if(cur && !answered && cur[l.prompt] && cur[l.answer]) renderCard(cur); else next();
}
dirSelect.addEventListener('change', ()=> setDir(dirSelect.value));

/* ----- answer format: pick from four, or write it out ----- */
const fmtToggle=document.getElementById('fmt-toggle');
function setFmt(v){
  fmt = v==='type' ? 'type' : 'choice';
  try{ localStorage.setItem(FMTKEY, fmt); }catch(e){}
  fmtToggle.querySelectorAll('.dir-opt').forEach(o=> o.classList.toggle('on', o.dataset.fmt===fmt));
  if(cur && !answered) renderCard(cur); else next();
}
fmtToggle.querySelectorAll('.dir-opt').forEach(o=> o.addEventListener('click', ()=> setFmt(o.dataset.fmt)));
fmtToggle.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setFmt(fmt==='type'?'choice':'type'); }});
fmtToggle.querySelectorAll('.dir-opt').forEach(o=> o.classList.toggle('on', o.dataset.fmt===fmt));

/* ----- difficulty slider: A1 .. C1, cumulative ----- */
const lvlRange=document.getElementById('lvl-range');
const lvlBadge=document.getElementById('lvl-badge');
const lvlCount=document.getElementById('lvl-count');
function paintLvl(){
  const i=LVLS.indexOf(maxLvl);
  lvlRange.value=String(i);
  lvlRange.style.setProperty('--level-fill', ((i/(LVLS.length-1))*100).toFixed(2)+'%');
  lvlBadge.innerHTML = i<=0 ? 'A1' : ('A1 &ndash; '+LVLS[i]);
  const inPlay=activePool().length, total=POOL.filter(lvlOk).length;
  lvlCount.textContent = inPlay+' out of '+total+' words';
}
lvlRange.addEventListener('input', ()=>{
  maxLvl=LVLS[+lvlRange.value]||'C1';
  try{ localStorage.setItem(LVLKEY, maxLvl); }catch(e){}
  paintLvl(); updateStats(); next();
});
paintLvl();

/* ----- keyboard ----- */
document.addEventListener('keydown', e=>{
  if(!document.getElementById('panel-train') || document.getElementById('panel-train').classList.contains('hidden')) return;
  if(document.activeElement && document.activeElement.tagName==='INPUT') return;
  if(['1','2','3','4'].includes(e.key)){ const i=+e.key-1; if(!answered && curOpts[i]) choose(i); }
  else if(e.key==='Enter'){ if(answered) next(); }
});

const musicToggle=document.getElementById('music-toggle');
const musicPlayer=document.getElementById('music-player');
let musicWanted=true;
let musicReady=false;
function paintMusic(){
  musicToggle.setAttribute('aria-pressed', String(musicWanted));
  musicToggle.textContent=musicWanted ? (musicReady ? '⏸ Music' : '🎵 Music') : '▶ Music';
}
async function playStudyMusic(){
  if(!musicPlayer || !musicWanted) return false;
  try{
    await musicPlayer.play();
    musicReady=true;
    paintMusic();
    return true;
  }catch(_){
    return false;
  }
}
function unlockStudyMusic(){ void playStudyMusic(); }
window.addEventListener('pointerdown', unlockStudyMusic, {once:true, capture:true});
window.addEventListener('keydown', unlockStudyMusic, {once:true, capture:true});
musicToggle.addEventListener('click', async ()=>{
  const isPlaying=!!musicPlayer && musicReady && !musicPlayer.paused;
  musicWanted=!isPlaying;
  if(musicWanted) await playStudyMusic();
  else if(musicPlayer){ musicPlayer.pause(); musicReady=false; }
  paintMusic();
});
paintMusic();
void playStudyMusic();

/* ----- init ----- */
updateStats(); next();
</script>
<script id="bgfx-js">
(function(){
var SC={"train": {"g": "ə ğ ı ş ç ö ü", "m": "light", "fx": ["motes"], "base": "#eef3ef"}, "lib": {"g": "❧ ❦ ◆", "m": "light", "fx": ["motes"], "base": "#f4efe3"}}, DEF="train";
var box=document.getElementById('bgfx'); if(!box) return;
var field=document.getElementById('bgfx-field');
var cnv=document.getElementById('bgfx-cnv'), ctx=cnv&&cnv.getContext&&cnv.getContext('2d');

var TAU=6.283185307, R=Math.random, AMP=1;
/* One amplitude knob for the whole canvas. A mark that reads at alpha .2 on a
   dark ground disappears on cream, so a light scene runs the same systems
   roughly twice as strong rather than getting its own hand-tuned numbers. */
function rgba(c,a){
  a=Math.max(0,Math.min(1,a*AMP));
  c=(c||"").trim();
  if(c.charAt(0)==="#"){
    var h=c.slice(1);
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return "rgba("+parseInt(h.slice(0,2),16)+","+parseInt(h.slice(2,4),16)+","+parseInt(h.slice(4,6),16)+","+a+")";
  }
  if(c.indexOf("rgb")===0) return c.replace(/^rgba?\(/,"rgba(").replace(/\)$/,"").split(",").slice(0,3).join(",")+","+a+")";
  return "rgba(160,180,220,"+a+")";
}
var FX={
 /* parallax star layers, twinkle, and a meteor every few seconds */
 stars:function(W,H,d){
   var s=[],n=Math.round(150*d),i,mx=0,my=0,met=null,nxt=3+R()*7;
   for(i=0;i<n;i++) s.push({x:R()*W,y:R()*H,z:.25+R(),r:.4+R()*1.5,p:R()*TAU,v:.25+R()*1.1});
   return function(x,t,dt,W,H,C){

       x.fillStyle=(i%9===0)?rgba(C.ac,a):rgba(C.star,a*.85);
       x.beginPath();x.arc(o.x+mx*22*o.z,o.y+my*16*o.z,o.r*o.z*1.7,0,TAU);x.fill();
     }
     nxt-=dt;
     if(!met&&nxt<=0){met={x:R()*W*.8,y:R()*H*.5,a:1,vx:180+R()*220,vy:70+R()*90};nxt=4+R()*9;}
     if(met){
       met.x+=met.vx*dt;met.y+=met.vy*dt;met.a-=dt*.75;
       if(met.a<=0){met=null;}else{
         var g=x.createLinearGradient(met.x,met.y,met.x-met.vx*.42,met.y-met.vy*.42);
         g.addColorStop(0,rgba(C.star,met.a));g.addColorStop(1,rgba(C.star,0));
         x.strokeStyle=g;x.lineWidth=1.8;x.beginPath();
         x.moveTo(met.x,met.y);x.lineTo(met.x-met.vx*.42,met.y-met.vy*.42);x.stroke();
       }
     }
   };
 },
 /* star trails: everything turns about one pole, the way the sky does */
 trails:function(W,H,d){
   var s=[],n=Math.round(150*d),i,cx=W*.72,cy=H*.24;
   for(i=0;i<n;i++){var rr=30+R()*Math.max(W,H)*.85,a=R()*TAU;
     s.push({r:rr,a:a,w:.10+R()*.1,l:.05+R()*.16,o:.16+R()*.5});}
   return function(x,t,dt,W,H,C){
     cx=W*.72;cy=H*.24;
     for(var i=0;i<s.length;i++){var o=s[i],a0=o.a+t*o.w*.06;
       x.strokeStyle=rgba(i%8===0?C.ac:C.star,o.o*.5);
       x.lineWidth=i%8===0?1.5:.9;
       x.beginPath();x.arc(cx,cy,o.r,a0,a0+o.l);x.stroke();
     }
     x.fillStyle=rgba(C.ac,.5);x.beginPath();x.arc(cx,cy,2.4,0,TAU);x.fill();
   };
 },
 /* an orrery: tilted ellipses with bodies running round them */
 orbit:function(W,H,d){
   var n=Math.max(4,Math.round(7*d)),o=[],i;
   for(i=0;i<n;i++) o.push({rx:.10+i*.085,ry:(.10+i*.085)*(.30+R()*.22),
     tilt:(R()-.5)*.9,sp:(.30-i*.032)*(R()*.4+.8),ph:R()*TAU,sz:1.8+R()*3.4});
   return function(x,t,dt,W,H,C){

/* Glow systems ADD light whatever the page is; everything else draws marks,
   which on a light page have to be ink or they vanish. */
var LIGHTEN={smoke:1,embers:1};

var W=0,H=0,DPR=1,dens=1,sys=[],curKey=null,raf=0,last=0,lastCol=0;
var C={c1:'#203040',c2:'#26405c',c3:'#101820',ac:'#8fd0ff',ink:'#ffffff',
       star:'#ffffff',glow:'#ffffff',dark:true,mx:0,my:0};
var tgt={x:0,y:0};

function readColors(){
  var cs=getComputedStyle(box);
  C.c1=cs.getPropertyValue('--c1')||C.c1;
  C.c2=cs.getPropertyValue('--c2')||C.c2;
  C.c3=cs.getPropertyValue('--c3')||C.c3;
  C.ac=cs.getPropertyValue('--ac')||C.ac;
  C.ink=cs.getPropertyValue('--ink')||C.ink;
  C.dark=box.getAttribute('data-mode')!=='light';
  C.star=C.dark?'#ffffff':C.ink;
  C.glow='#ffffff';
}
function size(){
  W=box.clientWidth||window.innerWidth; H=box.clientHeight||window.innerHeight;
  /* The canvas is cleared, fully redrawn and re-uploaded as one texture every
     frame. At a handset's native 2.6-3x that is a ~1.3 MP upload 60 times a
     second competing with the scroll raster, and every system drawn here is a
     soft glow carrying no detail worth the pixels. Capping the backing store on
     a phone cuts that work roughly fourfold and is not visible. */
  DPR=Math.min(W<=900?1.25:2,window.devicePixelRatio||1);
  dens=Math.max(.4,Math.min(1.35,(W*H)/(1440*900)));
  if(cnv){cnv.width=Math.round(W*DPR);cnv.height=Math.round(H*DPR);}
}
function build(){
  var sc=SC[curKey]||SC[DEF]||{}; var names=sc.fx||[];
  sys=[];
  for(var i=0;i<names.length;i++){
    if(FX[names[i]]) sys.push({f:FX[names[i]](W,H,dens),lit:!!LIGHTEN[names[i]]});
  }
}
function frame(ts){
  raf=requestAnimationFrame(frame);
  if(document.hidden||!ctx) return;
  var dt=Math.min(.05,(ts-last)/1000)||.016; last=ts;
  if(ts-lastCol>140){readColors();lastCol=ts;}
  C.mx+=(tgt.x-C.mx)*.06; C.my+=(tgt.y-C.my)*.06;
  AMP=C.dark?1:1.9;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<sys.length;i++){
    ctx.globalCompositeOperation=(sys[i].lit||C.dark)?'lighter':'source-over';
    sys[i].f(ctx,ts/1000,dt,W,H,C);
  }
  ctx.globalCompositeOperation='source-over';
}

/* Randomise every particle per element - size, spin, drift, duration and a
   NEGATIVE delay so the field starts mid-flight instead of all entering at
   once - and scale the count to viewport width or a phone gets a snowstorm. */
function glyphs(sc){
  if(!field) return;
  field.innerHTML='';
  var gl=(sc.g||'').split(' ').filter(Boolean); if(!gl.length) return;
  var n=Math.max(18,Math.min(56,Math.round(window.innerWidth/28)));
  for(var i=0;i<n;i++){
    var s=document.createElement('span');
    s.className='pt'+(Math.random()<0.35?' dn':'');
    /* U+FE0E forces TEXT presentation. Without it a zodiac or alchemical sign
       lands on the OS emoji face and renders as a coloured rounded box - which
       reads as a broken tile, not as a symbol, and no DOM check can see it. */
    s.textContent=gl[i%gl.length]+'︎';
    s.style.left=(Math.random()*100).toFixed(2)+'%';
    s.style.fontSize=(11+Math.random()*20).toFixed(1)+'px';
    s.style.opacity=(0.25+Math.random()*0.5).toFixed(2);
    s.style.animationDuration=(20+Math.random()*38).toFixed(1)+'s';
    s.style.animationDelay='-'+(Math.random()*50).toFixed(1)+'s';
    s.style.setProperty('--sx',(Math.random()*220-110).toFixed(0)+'px');
    s.style.setProperty('--sp',(Math.random()*720-360).toFixed(0)+'deg');
    field.appendChild(s);
  }
}
function apply(k){
  if(!SC[k]){
    /* a leaf key the table does not carry falls back to its BOOK, so a new
       tab in the host report gets its family's mood instead of scene one */
    var cut=String(k||'').indexOf('-');
    if(cut>0&&SC[String(k).slice(0,cut)]) k=String(k).slice(0,cut); else k=DEF;
  }
  var sc=SC[k]||{};
  curKey=k;
  box.setAttribute('data-scene',k);
  box.setAttribute('data-mode',sc.m||'dark');
  box.style.setProperty('--sheen',sc.sh||'24s');
  if(sc.base) document.documentElement.style.backgroundColor=sc.base;
  glyphs(sc);
  readColors();
  build();
}
/* Dissolve through the page base rather than cutting: the layer fades out,
   the scene is rebuilt while it is invisible, and it fades back in. */
var swapT=0, booted=false;
function paint(k,instant){
  if(instant||!booted){ booted=true; clearTimeout(swapT); box.style.opacity=''; apply(k); return; }
  if(k===curKey) return;
  box.style.opacity='0';
  clearTimeout(swapT);
  swapT=setTimeout(function(){ apply(k); box.style.opacity=''; },200);
}
window.bgfxPaint=paint;
window.bgfxScenes=SC;

size(); paint(DEF);
var rt=0, vw=window.innerWidth, vh=window.innerHeight;
/* A phone fires `resize` every time the URL bar collapses or reappears - which
   is something SCROLLING does, not something the user does. Rebuilding the
   canvas backing store and re-creating the whole particle field on that gesture
   runs mid-scroll and re-rasters the fixed layer under the moving text. Width
   changes (which covers every rotation) still rebuild; a bare height change has
   to clear the tallest URL bar to count. */
window.addEventListener('resize',function(){
  var w=window.innerWidth, h=window.innerHeight;
  if(w===vw && Math.abs(h-vh)<160) return;
  vw=w; vh=h;
  clearTimeout(rt); rt=setTimeout(function(){size();build();glyphs(SC[curKey]||{});},220);
});
/* The two parallax properties and the scroll property are written onto the
   elements that READ them, never onto #bgfx: setting an inherited custom
   property on the container marks its whole subtree for style recalc, and that
   subtree is a dozen gradient-and-blur layers - paid on every frame of every
   scroll for properties two children use. */
var wash=box.querySelector('.wash'), par=box.querySelector('.par');
/* Parallax is a MOUSE effect, so it is wired up only where there is a mouse. On
   a touch screen `pointermove` fires throughout a scroll drag, so this handler
   used to run against the scroll, writing to the background on the same frames
   the browser was rastering the text. */
if(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches){
  var pTick=false;
  window.addEventListener('pointermove',function(e){
    tgt.x=(e.clientX/window.innerWidth-.5)*2; tgt.y=(e.clientY/window.innerHeight-.5)*2;
    if(pTick) return; pTick=true;
    requestAnimationFrame(function(){
      var x=tgt.x.toFixed(3), y=tgt.y.toFixed(3);
      if(wash){ wash.style.setProperty('--px',x); wash.style.setProperty('--py',y); }
      if(par){ par.style.setProperty('--px',x); par.style.setProperty('--py',y); }
      pTick=false;
    });
  },{passive:true});
}
var sTick=false;
window.addEventListener('scroll',function(){
  if(sTick) return; sTick=true;
  requestAnimationFrame(function(){
    var m=document.documentElement.scrollHeight-window.innerHeight;
    if(wash) wash.style.setProperty('--scr',(m>0?window.pageYOffset/m:0).toFixed(3));
    sTick=false;
  });
},{passive:true});
if(ctx) raf=requestAnimationFrame(frame);

  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.tab[data-tab]');
    if(b) setTimeout(function(){paint(b.dataset.tab);},0);
  },true);
  var a=document.querySelector('.tab.active[data-tab],.tab.on[data-tab]');
  paint(a?a.dataset.tab:DEF);

})();
